name: Build Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Download audio files (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p public/sounds
          curl -L -o public/sounds/rain.mp3 "https://vsq.co.jp/plus/wordpress/wp-content/uploads/2021/07/VSQSE_0651_rain_05.mp3"
          curl -L -o public/sounds/birds.mp3 "https://vsq.co.jp/plus/wordpress/wp-content/uploads/2021/07/VSQSE_1016_bird_08.mp3"

      - name: Download audio files (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public/sounds
          Invoke-WebRequest -Uri "https://vsq.co.jp/plus/wordpress/wp-content/uploads/2021/07/VSQSE_0651_rain_05.mp3" -OutFile "public/sounds/rain.mp3"
          Invoke-WebRequest -Uri "https://vsq.co.jp/plus/wordpress/wp-content/uploads/2021/07/VSQSE_1016_bird_08.mp3" -OutFile "public/sounds/birds.mp3"

      - name: Build Tauri app (macOS)
        if: matrix.platform == 'macos-latest'
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Build Tauri app (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build

      - name: List build output (debug)
        shell: bash
        run: |
          echo "=== Build output ==="
          find src-tauri/target -name "*.dmg" -o -name "*.app" -o -name "*.msi" -o -name "*.exe" 2>/dev/null || true
          ls -la src-tauri/target/release/bundle/ 2>/dev/null || true

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Flowgain-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Flowgain-Windows
          path: src-tauri/target/release/bundle/nsis/
          if-no-files-found: warn
